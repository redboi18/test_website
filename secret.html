<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secret Page</title>
    <style>
        @font-face {
            font-family: Minecraftia;
            src: url(fonts/minecraftia.ttf);
        }

        body {
            font-family: Minecraftia;
            background-color: #f5d4fd;
            color: #1a1a1a;
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            color: #000000;
            font-size: 30px;
            text-align: center;
            font-weight: normal;
            letter-spacing: 2px;

            text-shadow: 4px 4px 0 rgb(0 0 0 / 0.5);

            border-width: 2px;
            border-style: solid;
            border-color: black;
        }

        .home-btn {
            background-color: #0066cc;
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: normal;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .home-btn:hover {
            background-color: #0052a3;
        }

        .home-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<!--<link href="style.css?v1.2" rel="stylesheet">-->

<body>

<h1>
    You found the secret page!!!
</h1>

<button type="button" class="home-btn" onclick="window.location.href='index.html'">
    Go Home...
</button>

</body>
</html>
